name: Chrome Web Store

on:
  pull_request:
    paths:
      - "extensions/pricescan-collector/**"
      - "scripts/build-pricescan-collector-webstore.sh"
      - "scripts/publish-chrome-webstore-v2.sh"
      - ".github/workflows/chrome-webstore.yml"
  push:
    branches: [main]
    tags: ["pricescan-collector-v*"]
    paths:
      - "extensions/pricescan-collector/**"
      - "scripts/build-pricescan-collector-webstore.sh"
      - "scripts/publish-chrome-webstore-v2.sh"
      - ".github/workflows/chrome-webstore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test extension scripts
        run: |
          node --test extensions/pricescan-collector/*.test.cjs
          ./scripts/build-pricescan-collector-webstore.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pricescan-collector-webstore
          path: artifacts/chrome-webstore/pricescan-collector-*-webstore.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/pricescan-collector-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag and build package
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./extensions/pricescan-collector/manifest.webstore.json').version")"
          test "$GITHUB_REF_NAME" = "pricescan-collector-v${version}"
          zip_path="$(./scripts/build-pricescan-collector-webstore.sh)"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
      - name: Authenticate service account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/122997755155/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: pricescan-chrome-webstore-ci@pricescan-cws-20260818.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        env:
          CHROME_WEBSTORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_WEBSTORE_PUBLISHER_ID: a6830834-3553-4d82-a2f1-4a886d8bcf91
          CHROME_WEBSTORE_EXTENSION_ID: llicapkpbafdjmdhofekdjoadnelkdif
        run: ./scripts/publish-chrome-webstore-v2.sh "${{ steps.package.outputs.zip_path }}"
