<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PriceScan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <img src="icons/icon-48.png" alt="" />
        <div>
          <strong>PriceScan</strong>
          <p>서버 관리형 AI 가격 조사</p>
        </div>
      </header>
      <section id="status" class="status" aria-live="polite">
        <span class="dot"></span>
        <p id="statusText">PriceScan에서 상품명만 입력하면 조사가 시작됩니다.</p>
      </section>
      <button id="capture" class="primary" type="button">PriceScan에서 AI 검색 시작</button>
      <button id="guidedOpen" class="link-button" type="button" hidden>진행 중인 조사 열기</button>
      <p class="privacy">로그인된 화면의 보이는 상품 정보만 읽습니다. 로그인·캡차·보안 확인은 사용자에게 넘깁니다.</p>
      <button id="openPriceScan" class="link-button" type="button" hidden>PriceScan 열기</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
