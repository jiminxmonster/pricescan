<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PriceScan</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <img src="icons/icon-48.png" alt="" />
        <div>
          <strong>PriceScan</strong>
          <p>네이버 현재 화면 가져오기</p>
        </div>
      </header>
      <section id="status" class="status" aria-live="polite">
        <span class="dot"></span>
        <p id="statusText">현재 탭을 확인하고 있습니다.</p>
      </section>
      <button id="capture" class="primary" type="button" disabled>현재 화면 최대 10개 가져오기</button>
      <p class="privacy">자동 검색·스크롤·재시도 없이, 버튼을 누른 현재 화면만 읽습니다.</p>
      <button id="openPriceScan" class="link-button" type="button">PriceScan 열기</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
